name: Passwordless Maker Onboarding CI

on:
  push:
    branches:
      - feature/passwordless-maker-onboarding
  workflow_dispatch:

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Laravel Pint (Maker onboarding module)
        run: |
          vendor/bin/pint --test \
            app/Features/Auth/Actions/RegisterMakerOnboardingAction.php \
            app/Features/Auth/Http/Controllers/Api/V1/MakerOnboardingRegisterController.php \
            app/Features/Auth/Http/Requests/MakerOnboardingRegisterRequest.php \
            database/migrations/2026_09_12_070000_make_user_password_nullable_for_passwordless_onboarding.php \
            routes/api/v1/auth.php \
            tests/Feature/Api/V1/Auth/MakerOnboardingRegistrationApiTest.php

      - name: Laravel Pint (Saved artwork module)
        run: |
          vendor/bin/pint --test \
            app/Features/Saves/Actions/SaveArtworkAction.php \
            app/Features/Saves/Actions/UnsaveArtworkAction.php \
            app/Features/Saves/Http/Controllers/Api/V1/SavedArtworkIndexController.php \
            app/Features/Saves/Http/Controllers/Api/V1/SavedArtworkStatusController.php \
            app/Features/Saves/Http/Controllers/Api/V1/SaveArtworkController.php \
            app/Features/Saves/Http/Controllers/Api/V1/UnsaveArtworkController.php \
            app/Features/Saves/Http/Requests/SavedArtworkIndexRequest.php \
            app/Features/Saves/Models/ArtworkSave.php \
            app/Features/Saves/Services/SavedArtworkService.php \
            database/migrations/2026_09_12_080000_create_artwork_saves_table.php \
            routes/api/v1/saves.php \
            tests/Feature/Api/V1/Saves/SavedArtworkApiTest.php

      - name: Focused Maker onboarding tests
        run: php artisan test tests/Feature/Api/V1/Auth/MakerOnboardingRegistrationApiTest.php tests/Feature/Api/V1/Makers/MakerOnboardingProfileApiTest.php

      - name: Focused Saved artwork tests
        run: php artisan test tests/Feature/Api/V1/Saves/SavedArtworkApiTest.php

      - name: Full Laravel regression
        run: php artisan test
