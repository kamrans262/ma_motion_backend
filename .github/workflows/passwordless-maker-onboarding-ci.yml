name: Passwordless Maker Onboarding CI

on:
  push:
    branches:
      - feature/passwordless-maker-onboarding
  workflow_dispatch:

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Laravel Pint (Maker onboarding module)
        run: |
          vendor/bin/pint --test \
            app/Features/Auth/Actions/RegisterMakerOnboardingAction.php \
            app/Features/Auth/Http/Controllers/Api/V1/MakerOnboardingRegisterController.php \
            app/Features/Auth/Http/Requests/MakerOnboardingRegisterRequest.php \
            database/migrations/2026_09_12_070000_make_user_password_nullable_for_passwordless_onboarding.php \
            routes/api/v1/auth.php \
            tests/Feature/Api/V1/Auth/MakerOnboardingRegistrationApiTest.php

      - name: Laravel Pint (Appreciator onboarding module)
        run: |
          vendor/bin/pint --test \
            app/Features/Appreciators/Models/AppreciatorProfile.php \
            app/Features/Auth/Actions/RegisterAppreciatorOnboardingAction.php \
            app/Features/Auth/Http/Controllers/Api/V1/AppreciatorOnboardingRegisterController.php \
            app/Features/Auth/Http/Requests/AppreciatorOnboardingRegisterRequest.php \
            app/Models/User.php \
            database/migrations/2026_09_14_000000_create_appreciator_profiles_table.php \
            routes/api/v1/auth.php \
            tests/Feature/Api/V1/Auth/AppreciatorOnboardingRegistrationApiTest.php

      - name: Laravel Pint (Saved artwork module)
        run: |
          vendor/bin/pint --test \
            app/Features/Saves/Actions/SaveArtworkAction.php \
            app/Features/Saves/Actions/UnsaveArtworkAction.php \
            app/Features/Saves/Http/Controllers/Api/V1/SavedArtworkIndexController.php \
            app/Features/Saves/Http/Controllers/Api/V1/SavedArtworkStatusController.php \
            app/Features/Saves/Http/Controllers/Api/V1/SaveArtworkController.php \
            app/Features/Saves/Http/Controllers/Api/V1/UnsaveArtworkController.php \
            app/Features/Saves/Http/Requests/SavedArtworkIndexRequest.php \
            app/Features/Saves/Models/ArtworkSave.php \
            app/Features/Saves/Services/SavedArtworkService.php \
            database/migrations/2026_09_12_080000_create_artwork_saves_table.php \
            routes/api/v1/saves.php \
            tests/Feature/Api/V1/Saves/SavedArtworkApiTest.php

      - name: Laravel Pint (Maker info settings module)
        run: |
          vendor/bin/pint --test \
            app/Features/Makers/Models/MakerProfile.php \
            app/Features/Makers/Models/MakerProfileContent.php \
            app/Features/Makers/Actions/UpdateMyMakerProfileAction.php \
            app/Features/Makers/Actions/SaveMakerProfileContentAction.php \
            app/Features/Makers/Actions/DeleteMakerProfileContentAction.php \
            app/Features/Makers/Http/Controllers/Api/V1/SaveProfileContentController.php \
            app/Features/Makers/Http/Controllers/Api/V1/DeleteProfileContentController.php \
            app/Features/Makers/Http/Requests/UpdateMyMakerProfileRequest.php \
            app/Features/Makers/Http/Requests/SaveMakerProfileContentRequest.php \
            app/Features/Makers/Http/Resources/MyMakerProfileResource.php \
            app/Features/Makers/Http/Resources/MakerProfileContentResource.php \
            app/Features/Discovery/Http/Resources/DiscoveryArtworkDetailResource.php \
            app/Features/Shows/Services/PublicShowService.php \
            app/Features/Admin/Makers/Actions/UpdateMakerAction.php \
            app/Features/Admin/Makers/Http/Controllers/UpdateProfileImageController.php \
            app/Features/Admin/Makers/Http/Controllers/DeleteProfileImageController.php \
            app/Features/Admin/Makers/Http/Controllers/SaveContentController.php \
            app/Features/Admin/Makers/Http/Controllers/DeleteContentController.php \
            app/Features/Admin/Makers/Http/Controllers/ShowController.php \
            app/Features/Admin/Makers/Http/Requests/UpdateMakerRequest.php \
            database/migrations/2026_09_13_000000_add_maker_info_settings_and_contents.php \
            routes/api/v1/makers.php \
            routes/web/admin.php \
            tests/Feature/Api/V1/Makers/MakerInfoSettingsApiTest.php \
            tests/Feature/Admin/AdminMakerManagementTest.php

      - name: Focused Maker onboarding tests
        run: php artisan test tests/Feature/Api/V1/Auth/MakerOnboardingRegistrationApiTest.php tests/Feature/Api/V1/Makers/MakerOnboardingProfileApiTest.php

      - name: Focused Appreciator onboarding tests
        run: php artisan test tests/Feature/Api/V1/Auth/AppreciatorOnboardingRegistrationApiTest.php

      - name: Focused Saved artwork tests
        run: php artisan test tests/Feature/Api/V1/Saves/SavedArtworkApiTest.php

      - name: Full Laravel regression
        run: php artisan test
