name: Passwordless Maker Onboarding CI

on:
  push:
    branches:
      - feature/passwordless-maker-onboarding
  workflow_dispatch:

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: Focused Maker onboarding tests
        run: php artisan test tests/Feature/Api/V1/Auth/MakerOnboardingRegistrationApiTest.php tests/Feature/Api/V1/Makers/MakerOnboardingProfileApiTest.php

      - name: Full Laravel regression
        run: php artisan test
